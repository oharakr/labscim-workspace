[General]
#debug-on-errors = true
#record-eventlog = true




num-rngs = 3

warmup-period = 1200s
sim-time-limit = 8400s
output-vector-file = "${resultdir}/${configname}-run-${runnumber}-120.vec"
output-scalar-file = "${resultdir}/${configname}-run-${runnumber}-120.sca"


*.cmdenv-log-level=detail
**.result-recording-modes=default
network = LabSCimLoRaWANvsTSCH
#*.numHosts =  ${numberOfHosts=2..10}

**.mobility.rng-0 = 1

check-signals = false # remove this and change modules accordingly

# Spectrum occupancy logs, read by src/spectrum_plotter/spectrum_plotter.py -- not by
# scavetool. The recorder writes relative to the working directory, which is the .ned
# directory and not the result directory, so the paths are built from ${resultdir}.
# SpectrumRadioReceiverPath selects the one radio whose received power is decomposed
# into the power log; leave it empty and only the usage log is written.
#
# Off for campaign runs, to save disk. A TSCH node toggles its radio every timeslot, so
# the log costs ~36 kB/s against ~1.7 kB/s for LoRa -- a full TSCH curve would write tens
# of GB. Spectrum figures come from short dedicated runs, which turn it back on without
# editing this file:
#
#   scripts/run_tsch.sh ... -x "--sim-time-limit=300s" \
#                              -x "--*.spectrumrecorder.EnableLog=true"
#
# Plot with scripts/plot_spectrum.sh, and zoom the time axis: a whole run is far too wide
# to show anything. A TSCH frame lasts about 2 ms, so the panel only reads at a window
# like -t 242,242.5; LoRa frames are ~50-400 ms and take a wider one.
*.spectrumrecorder.EnableLog = false
*.spectrumrecorder.LogName = "${resultdir}/${configname}-run-${runnumber}-120-spectrumUsage.txt"
*.spectrumrecorder.SpectrumLogName = "${resultdir}/${configname}-run-${runnumber}-120-spectrumPower.txt"
*.spectrumrecorder.SpectrumRadioReceiverPath = "contikinghost[0].wlan[0].radio"

*.*.mobility.coordinateSystemModule = "coordinateSystem" # reference

#*.visualizer.sceneVisualizer.typename = "OpenStreetMapSceneCanvasVisualizer"
#*.visualizer.sceneVisualizer.mapFile = xmldoc("map.osm")

#UTFPR Curitiba Campus - Brazil
*.coordinateSystem.sceneLongitude = -49.268640deg # scene origin
*.coordinateSystem.sceneLatitude = -25.439001deg # scene origin
*.coordinateSystem.sceneAltitude = 934m
*.coordinateSystem.sceneHeading = 0deg # scene orientation


